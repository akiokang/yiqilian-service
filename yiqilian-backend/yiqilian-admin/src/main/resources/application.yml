server:
  port: 8081 # 与 App 端端口 (8080) 区分

spring:
  application:
    name: yiqilian-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/yiqilian_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  # 后端管理特需：大文件视频上传限制
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  # 别名扫描路径，指向 model 模块中的实体类
  type-aliases-package: com.yiqilian.entity
  # 关键：classpath* 确保能扫描到依赖模块 resources 下的 XML
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志